name: Build release archive

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify mod asset
        run: test -f 'sound/fx/enderal/music/enderal - death.wav'

      - name: Package Vortex-ready archive
        run: |
          mkdir -p dist
          zip -r dist/Quieter-Enderal-Death-Sound-${GITHUB_REF_NAME#v}.zip \
            sound

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.zip
